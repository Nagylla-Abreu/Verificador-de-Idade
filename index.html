<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Verificador de Idade</title>
</head>
<body>
    <header>Verificador de Idade</header>
    <section id="bloco">
        <form id="ano">
            <label for="number">Ano de Nascimento: </label>
            <input type="number" id="number" required>
        </form>
        
        <form id="sexo">
            <label for="">Sexo:</label>
            <input type="radio" name="opcao" id="masc" value="masculino" required>
            <label for="masculino">Masculino</label>
            <input type="radio" name="opcao" id="fem" value="feminino">
            <label for="feminino">Feminino</label>
        </form>

        <input type="button" value="Verificar" id="verificar" onclick="verificar()">

        <div id="resultado">
            Preencha os dados acima para ver o resultado!
        </div>

        <div id="circulo">
        </div>
    </section>
    <footer>&copy; CursoemVideo</footer>
</body>
</html>
